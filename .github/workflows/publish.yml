# Publishes to PyPI with Trusted Publishing: PyPI trusts this workflow, in this repository, in the `pypi`
# environment. No API token is stored anywhere. See PUBLISHING.md.
name: Publish

on:
  release:
    types: [published]
  # A dry run to TestPyPI, started by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev build twine
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import smstunnel; print(smstunnel.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release tag $GITHUB_REF_NAME does not match the package version $version."
            exit 1
          fi
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smstunnel/
    permissions:
      id-token: write # lets PyPI check that this run is the trusted publisher
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/smstunnel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a version can go to TestPyPI only once; later dry runs skip it
